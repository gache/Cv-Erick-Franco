<section class="photo text-center">
  <div class="cv">
    <h1 class="display-1" [ngsReveal]="{
      reset: false,
      duration: 800,
      easing: 'cubic-bezier(0.6, 0.2, 0.1, 1)',
      scale: 0.85}">
      Développeur Web
    </h1>
    <h2 class="display-2" [ngsReveal]="{
      reset: false,
      duration: 1200,
      delay: 200,
      easing: 'cubic-bezier(0.6, 0.2, 0.1, 1)',
      scale: 0.85}">
      Erick Franco
    </h2>
    <a class="btn btn-hero btn-lg" [ngsReveal]="{
      reset: false,
      duration: 1500,
      delay: 400,
      easing: 'cubic-bezier(0.6, 0.2, 0.1, 1)',
      scale: 0.85}" (click)="scrollTo('contact')">
      Contactez-moi
    </a>
  </div>
</section>
